{% extends "base.html" %}

{% load i18n static %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css" href='{% static 'admin-lte/plugins/daterangepicker/daterangepicker.css' %}'/>
    <link rel="stylesheet" type="text/css"
          href='{% static 'admin-lte/plugins/bootstrap4-duallistbox/bootstrap-duallistbox.min.css' %}'/>
{% endblock %}

{% block extra_js %}
    <script src='{% static 'js/jquery.steps.min.js' %}'></script>
    <script src='{% static 'admin-lte/plugins/moment/moment.min.js' %}'></script>
    <script src='{% static 'admin-lte/plugins/daterangepicker/daterangepicker.js' %}'></script>
    <script src='{% static 'admin-lte/plugins/bootstrap4-duallistbox/jquery.bootstrap-duallistbox.min.js' %}'></script>

    <script>
        $(function () {
            /*
            *   Wizards
             */
            $('.wizard-body').steps({
                headerTag: "h2",
                bodyTag: "section",
                transitionEffect: "fade",
                autoFocus: true,
                titleTemplate: '<div class="title">#title#</div>',
                labels: {
                    previous: '< {% trans "Back" %}',
                    next: '{% trans "Next" %} >',
                    finish: '{% trans "Finish" %}',
                    current: ''
                },
                onFinishing: function (event, currentIndex, newIndex) {
                    return $('.wizard-form').submit();
                }
            });

            /*
            *   Daterange picker
             */
            $('.datepicker').daterangepicker({
                singleDatePicker: true,
                showDropdowns: true,
                autoUpdateInput: false,
                minYear: 1930,
                maxYear: parseInt(moment().format('YYYY'), 10),
                locale: {
                    format: 'YYYY-MM-DD',
                    daysOfWeek: [
                        '{% trans "Su" %}',
                        '{% trans "Mo" %}',
                        '{% trans "Tu" %}',
                        '{% trans "We" %}',
                        '{% trans "Th" %}',
                        '{% trans "Fr" %}',
                        '{% trans "Sa" %}'
                    ],
                    monthNames: [
                        '{% trans "January" %}',
                        '{% trans "February" %}',
                        '{% trans "March" %}',
                        '{% trans "April" %}',
                        '{% trans "May" %}',
                        '{% trans "June" %}',
                        '{% trans "July" %}',
                        '{% trans "August" %}',
                        '{% trans "September" %}',
                        '{% trans "October" %}',
                        '{% trans "November" %}',
                        '{% trans "December" %}'
                    ]
                }
            }, function (chosen_date) {
                $('.datepicker').val(chosen_date.format('YYYY-MM-DD'));
            });

            /*
             *  DualListbox
             */
            $('.duallistbox').bootstrapDualListbox({
                nonSelectedListLabel: '{% trans "Available" %}',
                selectedListLabel: '{% trans "Selected" %}',
                filterTextClear: '{% trans "show all" %}',
                filterPlaceHolder: '{% trans "Filter" %}',
                moveSelectedLabel: '{% trans "Move selected" %}',
                moveAllLabel: '{% trans "Move all" %}',
                removeSelectedLabel: '{% trans "Remove selected" %}',
                removeAllLabel: '{% trans "Remove all" %}',
                infoText: '{% trans "Showing all {0}" %}',
                infoTextFiltered: '<span class="badge badge-warning">{% trans "Filtered" %}</span> {0} from {1}',
                infoTextEmpty: '{% trans "Empty list" %}',
                moveOnSelect: false,
                btnClass: 'btn-outline-info',
                btnMoveText: '<i class="fas fa-angle-right"></i>',
                btnRemoveText: '<i class="fas fa-angle-left"></i>',
                btnMoveAllText: '<i class="fas fa-angle-double-right"></i>',
                btnRemoveAllText: '<i class="fas fa-angle-double-left"></i>'
            });

            if ($('.duallistbox').prop('disabled')) {
                $('.box1').remove();
                $('.box2 .btn-group').remove('');
                $('label[for="bootstrap-duallistbox-selected-list_members"]').hide();
            }

            /*
             *  Accordion animation
             */
            $('.fa-angle-down').click(function () {
                $(this).toggleClass('fa-rotate-180');
            });

            /*
             *  Enabling buttons only on form alteration
             */
            $('#save').hide();
            $('#reset').hide();

            $('form :input').on('keyup change', function () {
                $('#save').show();
                $('#reset').show();
            });

        });
    </script>
{% endblock %}
