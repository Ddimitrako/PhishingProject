{% extends "base.html" %}

{% load static %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css" href="{% static 'admin-lte/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'admin-lte/plugins/datatables-select/css/select.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'admin-lte/plugins/datatables-fixedheader/css/fixedHeader.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'admin-lte/plugins/datatables-fixedcolumns/css/fixedColumns.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'admin-lte/plugins/datatables-colreorder/css/colReorder.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css" href="{% static 'admin-lte/plugins/datatables-buttons/css/buttons.bootstrap4.min.css' %}"/>
{% endblock %}

{% block content %}
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <table id="table" class="table table-bordered table-hover table-head-fixed table-responsive-lg table-striped">
                        {% block table_content %}
                        {% endblock %}
                    </table>
                </div>
            </div>
        </div>
    </div>
{% endblock %}

{% block datatable_js %}
    <script src="{% static 'admin-lte/plugins/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-bs4/js/dataTables.bootstrap4.js' %}"></script>

    <script src="{% static 'admin-lte/plugins/datatables-fixedheader/js/dataTables.fixedHeader.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-fixedcolumns/js/dataTables.fixedColumns.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-colreorder/js/dataTables.colReorder.min.js' %}"></script>
    <script src="{%  static 'admin-lte/plugins/datatables-select/js/dataTables.select.min.js' %}"></script>

    <script src="{%  static 'admin-lte/plugins/datatables-buttons/js/dataTables.buttons.min.js' %}"></script>
    <script src="{%  static 'admin-lte/plugins/datatables-buttons/js/buttons.html5.min.js' %}"></script>
    <script src="{%  static 'admin-lte/plugins/datatables-buttons/js/buttons.print.min.js' %}"></script>
    <script src="{%  static 'admin-lte/plugins/datatables-buttons/js/buttons.colVis.min.js' %}"></script>

    <script src="{%  static 'admin-lte/plugins/jszip/jszip.min.js' %}"></script>
    <script src="{%  static 'admin-lte/plugins/pdfmake/pdfmake.min.js' %}"></script>
    <script src="{%  static 'admin-lte/plugins/pdfmake/vfs_fonts.js' %}"></script>

    <script>
        $(function () {
            $('#table thead tr').clone(true).appendTo( '#table thead' );
            $('#table thead tr:eq(0) th').each( function (i) {
                if ( i !== 0 ) {
                    var title = $(this).text();
                    $(this).html(
                                    '<div class="input-group input-group-xs">' +
                                        '<input type="text" class="form-control" placeholder="' + title + '" />' +
                                        '<div class="input-group-append">' +
                                            '<span class="input-group-text">' +
                                                '<i class="fas fa-filter"></i>' +
                                            '</span>' +
                                        '</div>' +
                                    '</div>'
                    );

                    $('input', this).on('keyup change', function () {
                        if (table.column(i).search() !== this.value) {
                            table
                                .column(i)
                                .search(this.value)
                                .draw();
                        }
                    });
                }
            } );

            var table = $('#table').DataTable({
                fixedHeader: true,
                searching: true,
                autoWidth: true,
                select: true,
                scrollY: 300,
                scrollX: true,
                scrollCollapse: true,
                paging: false,
                order: [[1, 'asc']],

                columnDefs: [
                    {
                        targets: 0,
                        className: 'noVis',
                        orderable: false,
                        width: '120px'
                    }
                ],
                fixedColumns: {
                    leftColumns: 1
                },
                colReorder: {
                    fixedColumnsLeft: 2
                },

                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'colvis',
                        className: 'btn btn-outline-info btn-sm dropdown-hover dropdown-toggle',
                        text: '<i class="fas fa-columns"></i> Columns',
                        titleAttr: 'Select columns',
                        columns: ':not(.noVis)'
                    },
                    {
                        extend: 'copy',
                        className: 'btn btn-outline-info btn-sm',
                        text: '<i class="far fa-copy"></i> Copy',
                        exportOptions: {
                            columns: ':not(.noVis):visible'
                        }
                    },
                    {
                        extend: 'print',
                        className: 'btn btn-outline-info btn-sm',
                        text: '<i class="fas fa-print"></i> Print',
                        exportOptions: {
                            columns: ':not(.noVis):visible'
                        }
                    },
                    {
                        extend: 'collection',
                        className: 'btn btn-outline-info btn-sm dropdown-hover dropdown-toggle',
                        text: '<i class="fas fa-file-export"></i> Export ',
                        titleAttr: 'Export to file',
                        buttons: [
                            {
                                extend: 'excel',
                                className: 'btn btn-outline-info btn-sm mr-1',
                                text: '<i class="far fa-file-excel"></i>',
                                titleAttr: 'Excel',
                                exportOptions: {
                                    columns: ':not(.noVis):visible'
                                }
                            },
                            {
                                extend: 'csv',
                                className: 'btn btn-outline-info btn-sm mr-1',
                                text: '<i class="far fa-file-alt"></i>',
                                titleAttr: 'CSV',
                                exportOptions: {
                                    columns: ':not(.noVis):visible'
                                }
                            },
                            {
                                extend: 'pdf',
                                className: 'btn btn-outline-info btn-sm mr-1',
                                text: '<i class="far fa-file-pdf"></i>',
                                titleAttr: 'PDF',
                                exportOptions: {
                                    columns: ':not(.noVis):visible'
                                }
                            }
                        ]
                    },
                    {
                        className: 'btn btn-outline-success btn-sm mr-1 dt-action-button',
                        text: '<i class="fas fa-file-upload"></i> Import',
                        action: function ( e, dt, node, config ) {
                            // TODO redirect to "Import from file" form
                            window.location = 'dashboard';
                        },
                        titleAttr: 'Import from file'
                    },
                    {
                        extend: 'collection',
                        className: 'btn btn-outline-success btn-sm mr-1 dropdown-hover dropdown-toggle dt-action-button',
                        text: '<i class="fas fa-plus-circle"></i> Add',
                        buttons: [
                            {
                                className: 'btn btn-outline-success btn-sm mr-1',
                                text: '<i class="fas fa-user"></i>',
                                action: function (e, dt, node, config) {
                                    // TODO redirect to "Create New User" form
                                    window.location = 'dashboard';
                                },
                                titleAttr: 'New user'
                            },
                            {
                                className: 'btn btn-outline-success btn-sm mr-1',
                                text: '<i class="fas fa-users"></i>',
                                action: function (e, dt, node, config) {
                                    // TODO redirect to "Create New Group" form
                                    window.location = 'dashboard';
                                },
                                titleAttr: 'New group'
                            }
                        ]
                    }
                ]
            });
        });
    </script>
{% endblock %}
