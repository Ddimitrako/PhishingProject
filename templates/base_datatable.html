{% extends "base.html" %}

{% load i18n static %}

{% block extra_head %}
    <link rel="stylesheet" type="text/css"
          href="{% static 'admin-lte/plugins/datatables-bs4/css/dataTables.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'admin-lte/plugins/datatables-select/css/select.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'css/dataTables.checkboxes.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'admin-lte/plugins/datatables-fixedheader/css/fixedHeader.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'admin-lte/plugins/datatables-fixedcolumns/css/fixedColumns.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'admin-lte/plugins/datatables-colreorder/css/colReorder.bootstrap4.min.css' %}"/>
    <link rel="stylesheet" type="text/css"
          href="{% static 'admin-lte/plugins/datatables-buttons/css/buttons.bootstrap4.min.css' %}"/>
{% endblock %}

{% block content %}
    <div class="card card-primary card-outline">
        <div class="card-body">
            <table id="table"
                   class="table table-bordered table-hover table-head-fixed table-responsive-lg table-striped">
                {% block table_content %}
                {% endblock %}
            </table>
        </div>
    </div>
{% endblock %}

{% block datatable_js %}
    <script src="{% static 'admin-lte/plugins/datatables/jquery.dataTables.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-bs4/js/dataTables.bootstrap4.js' %}"></script>

    <script src="{% static 'admin-lte/plugins/datatables-fixedheader/js/dataTables.fixedHeader.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-fixedcolumns/js/dataTables.fixedColumns.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-colreorder/js/dataTables.colReorder.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-select/js/dataTables.select.min.js' %}"></script>
    <script src="{% static 'js/dataTables.checkboxes.min.js' %}"></script>

    <script src="{% static 'admin-lte/plugins/datatables-buttons/js/dataTables.buttons.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-buttons/js/buttons.html5.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-buttons/js/buttons.print.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/datatables-buttons/js/buttons.colVis.min.js' %}"></script>

    <script src="{% static 'admin-lte/plugins/jszip/jszip.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/pdfmake/pdfmake.min.js' %}"></script>
    <script src="{% static 'admin-lte/plugins/pdfmake/vfs_fonts.js' %}"></script>

    <script>
        function datatable(tableID, noFilterList, noOrderList) {
            /* Constructing filter row*/
            $(tableID + ' thead tr').clone(true).appendTo('#table thead');
            $(tableID + ' thead tr:eq(0) th').each(function (i) {
                if (noFilterList.includes(i)) {
                    $(this).html('');
                } else {
                    var title = $(this).text();
                    $(this).html(
                        '<div class="input-group input-group-xs dt-col-filter">' +
                            '<input type="text" class="form-control" placeholder="' + title +'" />' +
                            '<div class="input-group-append">' +
                                '<span class="input-group-text">' +
                                    '<i class="fas fa-filter"></i>' +
                                '</span>' +
                            '</div>' +
                        '</div>'
                    );
                }
            });

            /* Constants used by datatable buttons */
            const now = new Date();
            const title = '{{ settings.TOOL_SHORT_NAME }}_' + '{{ request.resolver_match.view_name }}'.replace('sbam:', '');
            const filename = title + '_' + now.toLocaleDateString('en-US', {
                month: '2-digit',
                day: '2-digit',
                year: 'numeric'
            });

            /* Constructing datatable */
            var table = $(tableID).DataTable({
                fixedHeader: true,
                searching: true,
                autoWidth: true,
                scrollY: 300,
                scrollX: true,
                scrollCollapse: true,
                paging: false,
                order: [[noFilterList.length, 'asc']],

                columnDefs: [
                    {
                        targets: 0,
                        className: 'noVis',
                        orderable: false,
                        checkboxes: {
                            selectRow: true
                        }
                    },
                    {
                        targets: noFilterList,
                        className: 'noVis'
                    },
                    {
                        targets: noOrderList,
                        orderable: false
                    }
                ],
                select: {
                    style: 'multi'
                },
                fixedColumns: {
                    leftColumns: noFilterList.length
                },
                colReorder: {
                    fixedColumnsLeft: noFilterList.length
                },

                dom: 'Bfrtip',
                buttons: [
                    {
                        extend: 'colvis',
                        className: 'btn btn-outline-info btn-sm dropdown-hover dropdown-toggle',
                        text: '<i class="fas fa-columns"></i> {% trans "Columns" %}',
                        titleAttr: '{% trans "Select columns" %}',
                        columns: ':not(.noVis)'
                    },
                    {
                        extend: 'copy',
                        className: 'btn btn-outline-info btn-sm',
                        text: '<i class="far fa-copy"></i> {% trans "Copy" %}',
                        exportOptions: {
                            columns: ':not(.noVis):visible'
                        }
                    },
                    {
                        extend: 'print',
                        className: 'btn btn-outline-info btn-sm',
                        text: '<i class="fas fa-print"></i> {% trans "Print" %}',
                        title: title,
                        exportOptions: {
                            columns: ':not(.noVis):visible'
                        }
                    },
                    {
                        extend: 'collection',
                        className: 'btn btn-outline-info btn-sm dropdown-hover dropdown-toggle',
                        text: '<i class="fas fa-file-export"></i> {% trans "Export" %}',
                        titleAttr: '{% trans "Export to file" %}',
                        buttons: [
                            {
                                extend: 'excel',
                                className: 'btn btn-outline-info btn-sm mr-1',
                                text: '<i class="far fa-file-excel"></i>',
                                filename: filename,
                                title: title,
                                titleAttr: 'Excel',
                                exportOptions: {
                                    columns: ':not(.noVis):visible'
                                }
                            },
                            {
                                extend: 'csv',
                                className: 'btn btn-outline-info btn-sm mr-1',
                                text: '<i class="far fa-file-alt"></i>',
                                filename: filename,
                                title: title,
                                titleAttr: 'CSV',
                                exportOptions: {
                                    columns: ':not(.noVis):visible'
                                }
                            },
                            {
                                extend: 'pdf',
                                className: 'btn btn-outline-info btn-sm mr-1',
                                text: '<i class="far fa-file-pdf"></i>',
                                filename: filename,
                                title: title,
                                titleAttr: 'PDF',
                                exportOptions: {
                                    columns: ':not(.noVis):visible'
                                },
                                orientation: 'landscape',
                                pageSize: 'LEGAL'
                            }
                        ]
                    },
                    {
                        className: 'btn btn-outline-success btn-sm mr-1 dt-action-button',
                        text: '<i class="fas fa-file-upload"></i> {% trans "Import" %}',
                        action: function (e, dt, node, config) {
                            // TODO redirect to "Import from file" form
                            window.location = 'dashboard';
                        },
                        titleAttr: '{% trans "Import from file" %}'
                    },
                    {
                        extend: 'collection',
                        className: 'btn btn-outline-success btn-sm mr-1 dropdown-hover dropdown-toggle dt-action-button',
                        text: '<i class="fas fa-plus-circle"></i> {% trans "Add" %}',
                        buttons: [
                            {
                                className: 'btn btn-outline-success btn-sm mr-1',
                                text: '<i class="fas fa-user"></i>',
                                action: function (e, dt, node, config) {
                                    window.location = 'create_user';
                                },
                                titleAttr: '{% trans "New User" %}'
                            },
                            {
                                className: 'btn btn-outline-success btn-sm mr-1',
                                text: '<i class="fas fa-users"></i>',
                                action: function (e, dt, node, config) {
                                    // TODO redirect to "Create New Group" form
                                    window.location = 'dashboard';
                                },
                                titleAttr: '{% trans "New Group" %}'
                            }
                        ]
                    }
                ]
            });

            /* Apply column filter search */
            table.columns().eq(0).each(function (i) {
                $('input', $('th')[i]).on('keyup change clear', function () {
                    table
                        .column(i)
                        .search(this.value)
                        .draw();
                });
            });
        }
    </script>
{% endblock %}
