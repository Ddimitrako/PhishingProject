            <div class="header">
                <h1><b>{{ settings.TOOL_NAME }}</b></h1>
            </div>

            <div class="content">

                    <div class="row justify-content-center">

            {% include 'main_footer.html' %}

    </div>

    {% block modal %}
    {% endblock %}
{% endblock %}
