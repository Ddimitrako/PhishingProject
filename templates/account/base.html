{% load static %}

<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8"/>

        <link rel="shortcut icon" type="image/png" href="{% static 'img/es_logos/es_logo.png' %}"/>
        <title>Energy Shield | {% block title %}Security Culture Tool{% endblock %}</title>

        {% block extra_head %}
        {% endblock %}

        <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet"/>
        <link href="{% static 'css/style.css' %}" rel="stylesheet"/>
        <link href="{% static 'css/colors.css' %}" rel="stylesheet"/>

        <script src="{% static 'js/bootstrap.min.js' %}" type="text/javascript"></script>

        {% block css %}
        {% endblock %}
    </head>

    <body>
        <div class="wrapper">
            <div class="main-panel">
                <div class="content">
                    <div class="container-fluid">
                        <div class="header">
                            <img class="es_logo" src="{% static "img/es_logos/reference_es_logo.jpg" %}" alt="EnergyShield">
                            <h1 class="o-darkblue"><b>Security Culture Tool</b></h1>
                        </div>

                        <div class="row justify-content-center">
                            <div class="box-standing-out">
                                {% block content %}
                                {% endblock %}
                            </div>
                        </div>
                    </div>
                </div>

                <footer class="footer">
                    <div class="footer-copyright text-center"><b>&copy;
                            <script>document.write(new Date().getFullYear())</script>
                            <a href="https://energy-shield.eu/">Energy Shield</a></b></p>
                    </div>
                </footer>
            </div>
        </div>

        {% block modal %}
        {% endblock %}
    </body>

    {% block js %}
    {% endblock %}
</html>
