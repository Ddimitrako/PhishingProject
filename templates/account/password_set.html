{% extends "base_account.html" %}

{% load i18n %}

{% block head_title %}{% trans "Set Password" %}{% endblock %}

{% block content %}
    <h1 class="o-lightblue">{% trans "Set Password" %}</h1>

    <form method="POST" action="{% url 'account_set_password' %}" class="password_set">
        {% csrf_token %}
        {% include "form-fields.html" %}
        <input class="btn btn-primary btn-sm mt-3" type="submit" name="action" value="{% trans 'Set Password' %}"/>
    </form>
{% endblock %}
