version: '3.7'

services:
  web:
    build: 
      context: .
      dockerfile: ./compose/prod/Dockerfile_prod
    command: /start.sh
    volumes:
      - .:/usr/src/sbam/
    ports:
      - 80:80
    env_file:
      - .env/prod/.env_app_prod
    depends_on:
      - db
  db:
    image: postgres:11
    volumes:
      - ../sbam_prod_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    env_file:
      - .env/prod/.env_db_prod

