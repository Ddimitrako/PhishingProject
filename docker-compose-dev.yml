version: '3.7'

services:
  web:
    build: 
      context: .
      dockerfile: ./compose/dev/Dockerfile_dev
    command: /start.sh
    volumes:
      - .:/usr/src/sbam/
    ports:
      - 8000:8000
    env_file:
      - .env/dev/.env_app_dev
    depends_on:
      - db
  db:
    image: postgres:11
    volumes:
      - ../sbam_dev_data:/var/lib/postgresql/data
    ports:
      - 5432:5432
    env_file:
      - .env/dev/.env_db_dev

