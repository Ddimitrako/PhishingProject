version: '3.7'
volumes:
  sbam_db:

services:
  sbam:
    build: 
      context: .
      dockerfile: ./compose/dev/Dockerfile_dev
    command: /start.sh
    container_name: sbam
    hostname: sbam
    volumes:
      - .:/usr/src/sbam/
    ports:
      - 8000:8000
    env_file:
      - .env/dev/.env_app_dev
    depends_on:
      - db
  db:
    image: postgres:11
    hostname: db
    container_name: db
    volumes:
      - sbam_db:/var/lib/postgresql/data
    ports:
      - 5555:5432
    env_file:
      - .env/dev/.env_db_dev

